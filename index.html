
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PAT Fuse Rating Checker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px auto;
        max-width: 400px;
        padding: 0 20px;
        line-height: 1.5;
    }
    h2 { text-align: center; }
    label { font-weight: bold; }
    input {
        width: 100%;
        padding: 10px;
        margin: 8px 0 15px 0;
        font-size: 1rem;
    }
    button {
        width: 100%;
        padding: 12px;
        background: #0078d4;
        color: white;
        border: none;
        font-size: 1rem;
        cursor: pointer;
        border-radius: 4px;
    }
    button:hover { background: #005fa3; }
    #result {
        margin-top: 20px;
        padding: 15px;
        background: #f3f3f3;
        border-radius: 4px;
        font-size: 1.1rem;
    }
</style>
</head>

<body>

<h2>PAT Fuse Rating Checker</h2>

<label for="power">Power (W):</label>
<input id="power" type="number" placeholder="e.g. 1200">

<button onclick="checkFuse()">Check Fuse</button>

<div id="result"></div>

<script>
function checkFuse() {
    const power = parseFloat(document.getElementById("power").value);
    const voltage = 230;

    if (isNaN(power) || power <= 0) {
        document.getElementById("result").innerHTML = "Enter a valid wattage.";
        return;
    }

    const current = power / voltage;
    const fuse = power <= 700 ? 3 : 13;

    document.getElementById("result").innerHTML =
        `<strong>Current:</strong> ${current.toFixed(2)} A<br>
         <strong>Recommended Fuse:</strong> ${fuse}A`;
}
</script>

</body>
</html>
